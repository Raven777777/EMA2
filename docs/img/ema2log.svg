<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EMA2 Logo">
  <defs>
    <linearGradient id="edge-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8F6"/>
      <stop offset="50%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#004B87"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 不可见安全框：居中，宽高各为视图的 2/3（512 × 2/3 ≈ 341.333） -->
  <rect x="85.333" y="85.333" width="341.333" height="341.333"
        fill="none" stroke="none" pointer-events="none" aria-hidden="true"/>

  <!-- 将 Logo 缩放并居中，使其完整落在上面的 2/3 框内 -->
  <g transform="translate(31.6 52) scale(0.85)">
    <path d="M256,40C370,40,456,120,456,230C456,350,360,440,240,440C140,440,72,370,72,276C72,210,115,160,175,160C185,160,190,168,185,176C150,210,135,245,135,280C135,330,175,370,240,370C315,370,380,310,380,225C380,145,320,95,240,95C180,95,125,128,90,175C82,185,70,180,72,168C105,100,170,40,256,40Z"
          fill="url(#edge-flow)"
          filter="url(#shadow)"/>
  </g>
</svg>